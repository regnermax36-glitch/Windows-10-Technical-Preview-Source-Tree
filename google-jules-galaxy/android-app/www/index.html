<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Jules for Galaxy</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="cordova.js"></script>
  <script type="module" crossorigin src="./assets/index-kPg4aqGh.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BJZSGBaT.css">
</head>
<body class="bg-black text-white font-sans overflow-hidden h-screen w-screen flex items-center justify-center">

    <!-- Mock Samsung Galaxy Frame -->
    <div class="relative w-[360px] h-[760px] bg-galaxy-bg border-[8px] border-zinc-800 rounded-[3rem] shadow-2xl overflow-hidden">

        <!-- Wallpaper / Home Screen -->
        <div id="home-screen" class="absolute inset-0 bg-gradient-to-br from-indigo-900 via-purple-900 to-black p-6 pt-12">
            <div class="flex flex-col gap-4">
                <div class="w-full h-32 bg-white/10 backdrop-blur-md rounded-2xl p-4 flex flex-col justify-between">
                    <span class="text-xs font-medium text-white/60 uppercase">Weather</span>
                    <div class="flex justify-between items-end">
                        <span class="text-4xl">24°C</span>
                        <span class="text-sm">Seoul</span>
                    </div>
                </div>
                <div class="grid grid-cols-4 gap-4">
                    <div class="w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center">📞</div>
                    <div class="w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center">💬</div>
                    <div class="w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center">📸</div>
                    <div class="w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center">🌐</div>
                </div>
            </div>
        </div>

        <!-- Edge Panel Handle -->
        <div id="edge-handle" class="absolute right-0 top-1/3 w-1 h-20 bg-white/30 rounded-l-full cursor-pointer hover:bg-white/50 transition-all z-50"></div>

        <!-- Edge Panel Sidebar -->
        <div id="edge-sidebar" class="absolute right-[-100px] top-0 h-full w-[80px] bg-black/40 backdrop-blur-xl border-l border-white/10 transition-all duration-300 z-40 flex flex-col items-center py-12 gap-8">
            <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center cursor-pointer hover:bg-white/20">🏠</div>
            <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center cursor-pointer hover:bg-white/20">📅</div>
            <div class="w-10 h-10 rounded-xl bg-indigo-500/20 border border-indigo-400/50 flex items-center justify-center cursor-pointer" id="jules-trigger">✨</div>
            <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center cursor-pointer hover:bg-white/20">⚙️</div>
        </div>

        <!-- Jules Overlay -->
        <div id="jules-overlay" class="absolute inset-x-0 bottom-[-100%] h-[70%] bg-white/5 backdrop-blur-2xl border-t border-white/20 rounded-t-[2.5rem] transition-all duration-500 z-[60] p-6 flex flex-col">
            <div class="w-12 h-1 bg-white/20 rounded-full mx-auto mb-6"></div>

            <div class="flex-1 overflow-y-auto space-y-6">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-r from-blue-400 to-indigo-600 animate-pulse-glow"></div>
                    <h2 class="text-xl font-medium tracking-tight">How can I help, Jules?</h2>
                </div>

                <!-- Suggestions -->
                <div class="grid grid-cols-2 gap-3">
                    <button class="bg-white/10 hover:bg-white/20 p-4 rounded-2xl text-left text-sm transition-colors border border-white/5">
                        Summarize recent emails
                    </button>
                    <button id="smart-things-btn" class="bg-white/10 hover:bg-white/20 p-4 rounded-2xl text-left text-sm transition-colors border border-white/5">
                        Prepare living room
                    </button>
                </div>

                <!-- Response Mock (Hidden initially) -->
                <div id="jules-response" class="hidden space-y-4">
                    <div class="p-4 bg-indigo-500/10 border border-indigo-500/20 rounded-2xl">
                        <p class="text-sm leading-relaxed text-indigo-100">
                            I've set the temperature to 21°C and checked the Family Hub. You're low on milk. Shall I add it to your Keep list?
                        </p>
                    </div>
                </div>
            </div>

            <!-- Listening Indicator -->
            <div class="mt-auto pt-4 flex flex-col items-center">
                <div class="w-full h-[2px] bg-gradient-to-r from-transparent via-indigo-400 to-transparent animate-pulse opacity-50 mb-4"></div>
                <div class="flex gap-1 items-center h-4">
                    <div class="w-1 h-2 bg-blue-400 rounded-full animate-bounce"></div>
                    <div class="w-1 h-4 bg-indigo-400 rounded-full animate-bounce [animation-delay:-0.2s]"></div>
                    <div class="w-1 h-3 bg-blue-500 rounded-full animate-bounce [animation-delay:-0.4s]"></div>
                </div>
            </div>
        </div>

        <!-- S-Pen Interaction Layer -->
        <div id="spen-selection" class="absolute inset-0 pointer-events-none z-[100] hidden">
             <div id="selection-box" class="absolute border-2 border-dashed border-indigo-400 bg-indigo-400/10 rounded-lg"></div>
        </div>

    </div>

</body>
</html>
